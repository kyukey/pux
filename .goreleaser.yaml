version: 2

project_name: pux

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/pux
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: pux
    binaries: [pux]
    homepage: https://github.com/kyukey/pux
    description: Save commands, run them by name
    repository:
      owner: kyukey
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pux"]
          end

scoops:
  - name: pux
    homepage: https://github.com/kyukey/pux
    description: Save commands, run them by name
    license: Apache-2.0
    repository:
      owner: kyukey
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

release:
  github:
    owner: kyukey
    name: pux
